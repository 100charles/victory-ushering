<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#101a33">
<meta name="description" content="Ushering Serving Team · Victory Malolos. Assignments, sanctuary maps, the handbook, prayer requests and team fellowship.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ushering">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101a33'/%3E%3Cpath d='M16 52V26a16 16 0 0 1 32 0v26M32 16v36M10 52h44' fill='none' stroke='%23E6CE86' stroke-width='3.6' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Ushering Serving Team · Victory Malolos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#EDF4FC; --ink-soft:#B4CBE2; --ink-dim:#8AA6C4;
    --gold:#E6CE86; --gold-line:#D8B85E; --gold-deep:#C9A24B;
    --ice:#6FB2EC; --ice-deep:#3E93DF; --aqua:#57C7CB; --silver:#CBD8E6;
    --navy:#0B2545; --rose:#E58F8F;
    --bg:#101a33; --band:#141f3c; --band2:#0d1730;
    --glass:rgba(255,255,255,.055); --line:rgba(255,255,255,.13); --card:rgba(255,255,255,.05);
    --hdr:66px; --gut:20px; --maxw:1180px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 12px)}
  body{margin:0;color:var(--ink);background:var(--bg);font-family:"Inter",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:16px;line-height:1.6;overflow-x:hidden}
  body.lock{overflow:hidden}
  .shell{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
  .narrow{max-width:760px;margin-left:auto;margin-right:auto}
  h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;letter-spacing:.005em;margin:0}

  .prog{position:fixed;top:0;left:0;height:2px;width:0;z-index:120;
    background:linear-gradient(90deg,var(--ice-deep),var(--gold));transition:width .08s linear}

  /* ---------- header ---------- */
  .hdr{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--hdr);
    display:flex;align-items:center;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
  .hdr.stuck{background:rgba(12,23,45,.9);backdrop-filter:blur(18px);border-bottom-color:var(--line)}
  .hdr .shell{display:flex;align-items:center;gap:14px;width:100%}
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:none;padding:0;color:inherit;min-width:0;flex:1 1 auto}
  .brand .mark{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(150deg,#1b4470,#0d2a4f);border:1px solid rgba(230,206,134,.45)}
  .brand .mark svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.6}
  .brand .wm{text-align:left;line-height:1.15;min-width:0;overflow:hidden}
  .brand .wm b{display:block;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:19px;color:#F7FBFF;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .wm span{display:block;font-family:"Cinzel",serif;font-size:8.5px;letter-spacing:.24em;color:var(--gold);margin-top:1px}
  .mainnav{display:none;margin-left:auto;align-items:center;gap:2px}
  .mainnav button{appearance:none;border:none;background:none;color:var(--ink-soft);cursor:pointer;
    font-family:inherit;font-size:14.5px;font-weight:500;padding:9px 13px;border-radius:9px;position:relative;transition:color .18s}
  .mainnav button:hover{color:var(--ink)}
  .mainnav button.on{color:var(--gold)}
  .mainnav button.on::after{content:"";position:absolute;left:13px;right:13px;bottom:2px;height:1.5px;background:var(--gold);border-radius:2px}
  .hdr-act{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
  .mainnav + .hdr-act{margin-left:10px}
  .icobtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:11px;
    border:1px solid var(--line);background:var(--glass);color:var(--ink-soft);cursor:pointer;transition:.16s}
  .icobtn:hover{border-color:var(--gold-line);color:var(--gold)}
  .icobtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}
  .icobtn.on{border-color:var(--gold-line);color:var(--gold)}
  .cta{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:14px;
    padding:11px 19px;border-radius:999px;background:linear-gradient(180deg,var(--gold),#D3AF57);color:#20130A;
    transition:transform .16s,box-shadow .16s;white-space:nowrap;min-height:44px}
  .cta:hover{transform:translateY(-1px);box-shadow:0 10px 24px -12px rgba(230,206,134,.75)}
  .cta.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
  .cta.ghost:hover{border-color:var(--gold-line);box-shadow:none}
  #ctaMe{display:none}
  @media(min-width:1020px){ .mainnav{display:flex} .burger{display:none} #ctaMe{display:block} }
  @media(max-width:1019px){ #gear{display:none} }
  @media(max-width:520px){ .brand .wm b{font-size:15.5px} .brand .wm span{font-size:8px}
    .langbtn{width:40px;padding:0;justify-content:center} .langbtn .lb,.langbtn .ch{display:none} }

  /* language picker: one clear button + popover (replaces the TX / TL / EN chips) */
  .langwrap{position:relative;flex:none}
  .langbtn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 11px 0 10px;border-radius:11px;
    border:1px solid var(--line);background:var(--glass);color:var(--ink-soft);cursor:pointer;
    font-family:inherit;font-weight:600;font-size:13px;transition:.16s}
  .langbtn:hover,.langbtn[aria-expanded="true"]{border-color:var(--gold-line);color:var(--gold)}
  .langbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;flex:none}
  .langbtn .lb{white-space:nowrap}
  .langbtn .ch{width:12px;height:12px;stroke-width:2.4;transition:transform .2s}
  .langbtn[aria-expanded="true"] .ch{transform:rotate(180deg)}
  .langmenu{position:absolute;right:0;top:calc(100% + 8px);min-width:236px;background:#0e1a34;border:1px solid var(--line);
    border-radius:14px;padding:6px;box-shadow:0 24px 50px -22px rgba(0,0,0,.85);opacity:0;transform:translateY(-6px) scale(.98);
    pointer-events:none;transition:opacity .18s,transform .18s;z-index:110}
  .langmenu.on{opacity:1;transform:none;pointer-events:auto}
  .langmenu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
    background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:15px;font-weight:500;
    padding:11px 12px;border-radius:10px;cursor:pointer;min-height:48px}
  .langmenu button:hover{background:var(--glass);color:var(--ink)}
  .langmenu button.on{color:var(--gold);font-weight:600}
  .langmenu button small{display:block;font-size:12.5px;color:var(--ink-dim);font-weight:500;margin-top:1px}
  .langmenu button svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2.6;opacity:0;flex:none}
  .langmenu button.on svg{opacity:1}
  @media (prefers-reduced-motion:reduce){.langmenu{transition:none}}

  .scrim{position:fixed;inset:0;z-index:105;background:rgba(6,14,28,.65);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(330px,86vw);z-index:106;
    background:#0e1a34;border-left:1px solid var(--line);padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    transform:translateX(100%);transition:transform .34s cubic-bezier(.3,.8,.3,1);overflow-y:auto;
    display:flex;flex-direction:column;gap:5px}
  .drawer.on{transform:none}
  .drawer .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .drawer .lbl{font-family:"Cinzel",serif;font-size:9.5px;letter-spacing:.22em;color:var(--gold);margin:16px 0 4px}
  .drawer button[data-v]{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:16px;font-weight:500;
    padding:14px 12px;border-radius:12px;cursor:pointer;min-height:52px;transition:.15s}
  .drawer button[data-v]:hover{background:var(--glass);color:var(--ink)}
  .drawer button[data-v].on{background:linear-gradient(180deg,var(--gold),#D3AF57);color:#20130A;font-weight:600}
  .drawer button[data-v] svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
  .drawer .langsel{margin-top:14px;align-self:flex-start}

  /* ---------- hero ---------- */
  main{padding-top:var(--hdr)}
  .page{display:none}.page.on{display:block}
  .hero{position:relative;min-height:min(86vh,720px);display:flex;align-items:center;overflow:hidden;
    padding:64px 0 76px;border-bottom:1px solid var(--line)}
  .heroArt{position:absolute;inset:0;z-index:0}
  .heroArt svg{width:100%;height:100%;display:block}
  .heroArt::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(16,26,51,.55) 0%,rgba(16,26,51,.18) 38%,rgba(16,26,51,.95) 93%)}
  .heroIn{position:relative;z-index:2;width:100%}
  .kick{font-family:"Cinzel",serif;font-size:10.5px;letter-spacing:.3em;color:var(--gold);
    text-transform:uppercase;margin:0 0 18px;padding-left:.3em}
  .hero h1{font-size:clamp(40px,7vw,84px);line-height:1.02;max-width:13ch;color:#FBFDFF}
  .hero h1 em{font-style:normal;color:var(--gold)}
  .hero .sub{margin:24px 0 0;max-width:54ch;font-size:clamp(15.5px,1.9vw,18.5px);color:var(--ink-soft);line-height:1.65}
  .heroBtns{display:flex;gap:11px;margin-top:28px;flex-wrap:wrap}
  .heroBtns .cta{padding:14px 26px;font-size:15px}
  .heroVerse{margin:32px 0 0;padding-left:15px;border-left:2px solid rgba(230,206,134,.6);max-width:46ch;
    font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17.5px;color:var(--ink-soft);line-height:1.5}
  .heroVerse b{display:block;font-family:"Cinzel",serif;font-style:normal;font-size:9.5px;
    letter-spacing:.2em;color:var(--gold);margin-top:8px;font-weight:600}
  .scrollcue{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;
    font-family:"Cinzel",serif;font-size:9px;letter-spacing:.2em;color:var(--ink-dim);
    display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
  .scrollcue i{display:block;width:1px;height:26px;background:linear-gradient(180deg,var(--gold),transparent)}
  @media (prefers-reduced-motion:no-preference){.scrollcue i{animation:cue 2.4s ease-in-out infinite}
    @keyframes cue{0%,100%{opacity:.25;transform:scaleY(.6)}50%{opacity:1;transform:scaleY(1)}}}

  .heroArt{--open:0;--tilt:0}
  .doorL,.doorR{transform-box:fill-box;transition:transform 1.9s cubic-bezier(.2,.75,.25,1)}
  .doorL{transform-origin:left center;transform:perspective(900px) rotateY(calc(var(--open) * -78deg))}
  .doorR{transform-origin:right center;transform:perspective(900px) rotateY(calc(var(--open) * 78deg))}
  .heroArt.open{--open:1}
  .glow{opacity:calc(.08 + var(--open) * .92);transition:opacity 2.2s ease .4s}
  .ray{transform-box:fill-box;transform-origin:center top;
    transform:translateX(calc(var(--tilt) * 22px)) rotate(calc(var(--tilt) * 2.6deg))}
  .knob{opacity:calc(1 - var(--open));transition:opacity .3s}
  .heroArt.live .doorL,.heroArt.live .doorR,.heroArt.live .glow{transition:none}
  .heroArt.live .ray{transition:transform .25s ease-out}
  @media (prefers-reduced-motion:reduce){
    .doorL,.doorR{transition:none}
    .doorL{transform:translateX(calc(var(--open) * -44%))}
    .doorR{transform:translateX(calc(var(--open) * 44%))}
    .glow{transition:none}}

  /* ---------- page heads / bands ---------- */
  .phead{padding:52px 0 32px;border-bottom:1px solid var(--line);
    background:radial-gradient(900px 320px at 20% -40%,rgba(63,147,223,.16),transparent 70%)}
  .phead h1{font-size:clamp(30px,5.4vw,52px);line-height:1.08}
  .phead p{margin:14px 0 0;max-width:60ch;color:var(--ink-soft);font-size:16px}
  .band{padding:70px 0;border-bottom:1px solid var(--line)}
  .band.alt{background:var(--band)}
  .band.tight{padding:44px 0}
  .shead{text-align:center;margin-bottom:36px}
  .shead .kick{margin-bottom:12px}
  .shead h2{font-size:clamp(27px,4.6vw,44px);line-height:1.12;color:#F7FBFF}
  .shead p{margin:14px auto 0;max-width:58ch;color:var(--ink-soft);font-size:16px}
  .rv{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1)}
  .rv.in{opacity:1;transform:none}
  /* children of revealed grids rise in one after another; fill-mode "backwards" keeps hover transforms free afterwards */
  @media (prefers-reduced-motion:no-preference){
    .g3.rv.in>*,.vals.rv.in>*,.rot.rv.in>*,.stats.rv.in>*{animation:riseIn .65s cubic-bezier(.2,.7,.3,1) backwards}
    .rv.in>*:nth-child(2){animation-delay:.07s}.rv.in>*:nth-child(3){animation-delay:.14s}
    .rv.in>*:nth-child(4){animation-delay:.21s}.rv.in>*:nth-child(5){animation-delay:.28s}
    .rv.in>*:nth-child(6){animation-delay:.35s}.rv.in>*:nth-child(7){animation-delay:.42s}
    .rv.in>*:nth-child(8){animation-delay:.49s}.rv.in>*:nth-child(9){animation-delay:.56s}
    @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .page.on{animation:pageIn .38s cubic-bezier(.2,.7,.3,1) backwards}
    @keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
  @media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 12px;text-align:center}
  @media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat b{display:block;font-family:"Cormorant Garamond",serif;font-weight:700;
    font-size:clamp(38px,6.5vw,58px);line-height:1;color:var(--gold)}
  .stat span{display:block;font-family:"Cinzel",serif;font-size:9.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-dim);margin-top:9px}

  .cdwrap{border:1px solid rgba(230,206,134,.32);border-radius:20px;padding:22px 24px;
    background:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    display:flex;flex-wrap:wrap;align-items:center;gap:20px}
  .cdwrap .who{flex:1 1 240px;min-width:0}
  .cdwrap .who .kick{margin-bottom:7px}
  .cdwrap .who b{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:26px;display:block;color:#F7FBFF}
  .cdwrap .who span{display:block;font-size:14px;color:var(--ink-soft);margin-top:4px}
  .tline{display:grid;gap:5px;margin-top:14px}
  .tline div{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft);padding:7px 10px;border-radius:10px;border:1px solid transparent}
  .tline div b{font-family:"Inter",system-ui,sans-serif;font-weight:700;font-size:14px;color:#F4F9FF;min-width:72px}
  .tline div.next{border-color:rgba(230,206,134,.45);background:rgba(230,206,134,.09);color:var(--ink)}
  .tline div.next b{color:var(--gold)}
  .tline div.past{opacity:.5}
  .tline i{width:7px;height:7px;border-radius:50%;background:var(--ink-dim);flex:none}
  .tline div.next i{background:var(--gold);box-shadow:0 0 0 4px rgba(230,206,134,.18)}
  .cdtags{margin-top:12px;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
  .cdtags .ontime{font-family:"Cinzel",serif;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .cdunits{display:flex;gap:8px}
  .cdu{min-width:62px;text-align:center;border:1px solid var(--line);border-radius:13px;padding:11px 8px;background:rgba(0,0,0,.22)}
  .cdu b{display:block;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:25px;line-height:1;color:var(--gold)}
  .cdu span{display:block;font-family:"Cinzel",serif;font-size:8px;letter-spacing:.14em;color:var(--ink-dim);margin-top:6px}

  .g3{display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:700px){.g3{grid-template-columns:repeat(3,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px;
    transition:border-color .2s,transform .2s,background .2s}
  button.tile{display:block;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
  button.tile:hover{border-color:var(--gold-line);transform:translateY(-3px);background:rgba(255,255,255,.075)}
  .tile .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:15px;
    background:rgba(230,206,134,.13);border:1px solid rgba(230,206,134,.28)}
  .tile .ico svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.7}
  .tile h3{font-size:22px;margin-bottom:7px;color:#F4F9FF}
  .tile p{margin:0;color:var(--ink-soft);font-size:14.5px;line-height:1.6}
  .tile .more{display:inline-flex;align-items:center;gap:6px;margin-top:14px;color:var(--gold);font-size:13.5px;font-weight:600}
  .tile .more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .2s}
  button.tile:hover .more svg{transform:translateX(4px)}

  .vals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:640px){.vals{grid-template-columns:repeat(3,1fr)}}
  .val{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center}
  .val b{display:block;font-size:14px;font-weight:700;color:var(--gold);line-height:1.3}
  .val span{display:block;font-size:12.5px;color:var(--ink-dim);margin-top:6px;line-height:1.5}

  .rot{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
  @media(min-width:760px){.rot{grid-template-columns:repeat(4,1fr)}}
  .rotc{border:1px solid var(--line);border-radius:15px;padding:16px;background:var(--card);text-align:center}
  .rotc.now{border-color:var(--gold-line);background:rgba(230,206,134,.1)}
  .rotc .d{font-family:"Cinzel",serif;font-size:9px;letter-spacing:.14em;color:var(--ink-dim)}
  .rotc .tm{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:24px;color:#F4F9FF;margin:6px 0 2px}
  .rotc.now .tm{color:var(--gold)}
  .rotc .p{font-size:12px;color:var(--ink-dim)}

  .cnt3{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .cntbox{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);text-align:center}
  .cntbox .lb{font-family:"Cinzel",serif;font-size:9px;letter-spacing:.16em;color:var(--ink-dim)}
  .cntbox .nm{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:46px;line-height:1;color:var(--gold);margin:8px 0}
  .cntrow{display:flex;gap:8px;justify-content:center}
  .cntrow button{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--glass);
    color:var(--ink);font-size:24px;cursor:pointer;line-height:1;font-weight:600;width:52px}
  .cntrow button.plus{background:linear-gradient(180deg,var(--gold),#D3AF57);color:#20130A;border:none;flex:1;width:auto}
  .cnttot{margin-top:14px;text-align:center;font-size:14px;color:var(--ink-soft)}
  .cnttot b{font-family:"Cormorant Garamond",serif;font-size:34px;color:#F4F9FF;display:block;margin-top:2px}

  /* ---------- shared ---------- */
  .lead{color:var(--ink-soft);font-size:15.5px;margin:0 auto;max-width:660px;line-height:1.65;text-align:center}
  .lead b.ice{color:#8FC4F2}.lead b.gold{color:var(--gold)}
  .center{text-align:center}
  .btn{appearance:none;font-family:inherit;font-weight:600;font-size:14.5px;padding:13px 18px;border-radius:12px;
    border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;min-height:48px;transition:.15s}

(function(){

"use strict";

/* --- CONFIG ---------------------------------------------------------
   Paste the Google Apps Script web-app URL here to switch prayer
   requests AND the photo wall from demo mode to live. One free script
   handles both (see apps-script/SETUP.md). Leave "" for demo mode.
   You may point PRAYER_ENDPOINT / FELLOWSHIP_ENDPOINT at different
   deployments if you ever split them. ------------------------------ */
const API_ENDPOINT = "";
const PRAYER_ENDPOINT = API_ENDPOINT;
const FELLOWSHIP_ENDPOINT = API_ENDPOINT;
const SITE_VERSION = "2.2";

const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const add=(p,n,a)=>{const e=el(n,a);p.appendChild(e);return e;};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICE="#3E93DF",GOLD="#E4C877",AQUA="#57C7CB",SILVER="#CBD8E6",NAVYC="#7FA6D4";

/* ---------- network: talk to the Google Apps Script web app ----------
   POST bodies are sent as text/plain so the browser never sends a CORS
   preflight (Apps Script cannot answer one). The script replies with JSON
   after a redirect; on any failure we return {ok:false,error} and the
   caller keeps the record on the phone. Nothing here ever throws. */
function withTimeout(ms){
  const c=("AbortController" in window)?new AbortController():null;
  const t=c?setTimeout(()=>c.abort(),ms):null;
  return {signal:c?c.signal:undefined,done:()=>{if(t)clearTimeout(t);}};
}
function parseJSON(txt){try{const j=JSON.parse(txt);return j&&typeof j==="object"?j:null;}catch(e){return null;}}
async function apiPost(url,payload,ms){
  if(!url)return {ok:false,error:"no_endpoint"};
  const w=withTimeout(ms||25000);
  try{
    const r=await fetch(url,{method:"POST",body:JSON.stringify(payload),signal:w.signal,redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"}});
    w.done();
    return parseJSON(await r.text())||{ok:false,error:"bad_response"};
  }catch(e){w.done();return {ok:false,error:(e&&e.name==="AbortError")?"timeout":"network"};}
}
async function apiGet(url,params,ms){
  if(!url)return {ok:false,error:"no_endpoint"};
  const w=withTimeout(ms||25000);
  const q=Object.keys(params||{}).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
  try{
    const r=await fetch(url+(url.indexOf("?")>-1?"&":"?")+q,{signal:w.signal,redirect:"follow"});
    w.done();
    return parseJSON(await r.text())||{ok:false,error:"bad_response"};
  }catch(e){w.done();return {ok:false,error:(e&&e.name==="AbortError")?"timeout":"network"};}
}

/* ---- satellites: exactly the handbook tables (p.12-13) ----
   each usher: [code, extra duties, colour]. "bag" = Tithe Bag,
   "partnerbag" = Partner Tithe Bag, "count" = Attendance Counting. */
function sat(id,name,spec){
  const items=[P("GREETERS","Greeters",TCOL.silver,"G",["greet"])];
  spec.ushers.forEach(([code,duties,col])=>{
    items.push(P(code,"Usher "+code.slice(2),col,code.replace("-",""),["usat","seat"].concat(duties)));
  });
  if(spec.admin)items.push(P("ADMIN","Admin",TCOL.navy,"SUP",["admin","count"]));
  items.push(P("TEAM LEADER","Team Leader",TCOL.navy,"SUP",["tl"]));
  items.forEach(p=>p.campus=id);
  CAMPUS[id]={id,name,posts:items,modes:["seat"]};
}

function makeZoomer(svg){
  const wrap=svg.parentElement;
  let full={x:0,y:0,w:1080,h:560}, vb={...full}, raf=null;
  const MINW=150;
  const apply=()=>svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  function sizeWrap(ar){
    const w=Math.max(220,(wrap.clientWidth||360)-16);
    const maxH=Math.min(520,Math.max(300,Math.round(window.innerHeight*0.56)));
    wrap.style.height=Math.round(Math.max(150,Math.min(maxH,w/ar)))+"px";
  }
  function norm(tg){
    const ar=tg.w/tg.h;
    let w=Math.min(tg.w,full.w),h=w/ar;
    if(h>full.h){h=full.h;w=h*ar;}
    if(w<MINW){w=MINW;h=w/ar;}
    const cx=tg.x+tg.w/2, cy=tg.y+tg.h/2;
    let x=Math.min(full.x+full.w-w,Math.max(full.x,cx-w/2));
    let y=Math.min(full.y+full.h-h,Math.max(full.y,cy-h/2));
    return {x,y,w,h};
  }
  const clampPos=()=>{vb.x=Math.min(full.x+full.w-vb.w,Math.max(full.x,vb.x));
    vb.y=Math.min(full.y+full.h-vb.h,Math.max(full.y,vb.y));};
  function animateTo(tg,dur){
    const tt=norm(tg); sizeWrap(tt.w/tt.h);
    if(raf)cancelAnimationFrame(raf);
    const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
    const from={...vb},t0=performance.now();dur=reduce?0:(dur==null?460:dur);
    if(!dur){vb=tt;apply();return;}
    (function step(now){
      const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
      vb={x:from.x+(tt.x-from.x)*e,y:from.y+(tt.y-from.y)*e,w:from.w+(tt.w-from.w)*e,h:from.h+(tt.h-from.h)*e};
      apply(); if(k<1)raf=requestAnimationFrame(step);
    })(t0);
  }
  const pts=new Map();let pinch0=null,moved=false;
  const unit=()=>vb.w/(svg.getBoundingClientRect().width||1);
  svg.addEventListener("pointerdown",e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
    if(pts.size===2){const[a,b]=[...pts.values()];
      pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w,ar:vb.w/vb.h,cx:vb.x+vb.w/2,cy:vb.y+vb.h/2};}});
  svg.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;
    const pv=pts.get(e.pointerId),dx=e.clientX-pv.x,dy=e.clientY-pv.y;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(Math.abs(dx)>2||Math.abs(dy)>2)moved=true;
    if(pts.size>=2&&pinch0){const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d>0){let w=Math.min(full.w,Math.max(MINW,pinch0.w*(pinch0.d/d))),h=w/pinch0.ar;
        if(h>full.h){h=full.h;w=h*pinch0.ar;}
        vb={x:pinch0.cx-w/2,y:pinch0.cy-h/2,w,h};}
    }else{const u=unit();vb.x-=dx*u;vb.y-=dy*u;}
    clampPos();apply();});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=null;};
  svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
  svg.addEventListener("wheel",e=>{e.preventDefault();
    const ar=vb.w/vb.h,cx=vb.x+vb.w/2,cy=vb.y+vb.h/2,f=e.deltaY>0?1.14:0.88;
    let w=Math.min(full.w,Math.max(MINW,vb.w*f)),h=w/ar;
    if(h>full.h){h=full.h;w=h*ar;}
    vb={x:cx-w/2,y:cy-h/2,w,h};clampPos();apply();},{passive:false});
  return {
    setFull(f){full={...f};vb={...f};apply();sizeWrap(f.w/f.h);},
    focus(b,pad){pad=pad==null?16:pad;animateTo({x:b.x-pad,y:b.y-pad,w:b.w+pad*2,h:b.h+pad*2});},
    fit(){animateTo({...full});},
    resize(){sizeWrap(vb.w/vb.h);},
    didMove:()=>moved
  };
}

   13. FELLOWSHIP: photo wall for the four Complex teams

const TEAMS=[1,2,3,4];
let fellTab="feed", fellFilter="all", pendingPhoto=null;
/* LS_FL  : demo-mode posts (photo inside) and, in live mode, uploads that
            have not reached the server yet (pending:true)
   LS_FLC : live-mode feed cache (metadata + Drive URLs only, no image data) */
const LS_FL="vm_us_fl", LS_FLC="vm_us_flc";
const justPosted={};            /* id → dataURL, so your own upload shows instantly */
let flLast=0, flBusy=false;
function flLoad(){try{return JSON.parse(ls.get(LS_FL,"[]"))||[];}catch(e){return [];}}
function flSave(a){
  /* localStorage.setItem throws on quota; ls.set swallows it, so verify the write */
  const fits=arr=>{const s=JSON.stringify(arr);ls.set(LS_FL,s);return ls.get(LS_FL,"")===s;};
  if(fits(a))return true;
  /* photos are heavy; drop the oldest until it fits */
  const copy=a.slice();
  while(copy.length>1){copy.pop();if(fits(copy)){toast(t("fl_full"));return true;}}
  return false;
}
function flCache(){try{return JSON.parse(ls.get(LS_FLC,"[]"))||[];}catch(e){return [];}}
function flCacheSave(a){ls.set(LS_FLC,JSON.stringify(a.slice(0,120)));}
async function flFetch(){
  const r=await apiGet(FELLOWSHIP_ENDPOINT,{kind:"photos"});
  if(r.ok&&Array.isArray(r.items)){flCacheSave(r.items);flLast=Date.now();}
  return r;
}
/* refresh the live feed at most every 45s, or when forced */
async function flRefresh(force){
  if(!FELLOWSHIP_ENDPOINT||flBusy)return;
  if(!force&&Date.now()-flLast<45000)return;
  if(!online())return;
  flBusy=true;
  if(currentView==="fell"&&fellTab==="feed")renderFell();
  const r=await flFetch();
  flBusy=false;
  if(!r.ok&&currentView==="fell")toast(t("net_err"),"err");
  if(currentView==="fell"&&fellTab==="feed")renderFell();
}
/* shrink on the phone before upload: a 4MB camera photo becomes ~180KB */
function shrink(file,maxPx,quality){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("read"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("decode"));
      img.onload=()=>{
        let{width:w,height:h}=img;
        const s=Math.min(1,maxPx/Math.max(w,h));
        w=Math.round(w*s);h=Math.round(h*s);
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        res(cv.toDataURL("image/jpeg",quality));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function flSend(rec){
  if(!FELLOWSHIP_ENDPOINT){const a=flLoad();a.unshift(rec);flSave(a);return {ok:true,demo:true};}
  const r=await apiPost(FELLOWSHIP_ENDPOINT,Object.assign({kind:"photo"},rec),60000);
  if(r.ok){
    if(rec.img)justPosted[rec.id]=rec.img;
    const c=flCache().filter(x=>x.id!==rec.id);
    c.unshift({id:rec.id,at:rec.at,team:rec.team,by:rec.by,cap:rec.cap,campus:rec.campus,url:r.url||"",fileId:r.fileId||""});
    flCacheSave(c);
    /* it may have been a retry of a pending post */
    flSave(flLoad().filter(x=>x.id!==rec.id));
    return {ok:true,demo:false};
  }
  /* could not reach the script: keep it on the phone, offer a retry */
  rec.pending=true;
  const a=flLoad().filter(x=>x.id!==rec.id);a.unshift(rec);flSave(a);
  return {ok:false,demo:false,error:r.error};
}
async function flRetry(id,btn){
  const rec=flLoad().find(x=>x.id===id);if(!rec)return;
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>'+esc(t("fl_uploading"));}
  const r=await flSend(rec);
  toast(r.ok?t("fl_posted"):t("fl_pending"),r.ok?"":"err");
  renderFell();
}
/* on boot / back online: quietly push any pending uploads */
async function flFlushPending(){
  if(!FELLOWSHIP_ENDPOINT||!online())return;
  const pend=flLoad().filter(x=>x.pending);
  for(const rec of pend){const r=await flSend(rec);if(!r.ok)break;}
}
/* Drive thumbnails occasionally 403 for a moment; fall back to the script's proxy once */
function bindImgFallback(container){
  container.addEventListener("error",async e=>{
    const img=e.target;
    if(!img||img.tagName!=="IMG"||img.dataset.fb||!FELLOWSHIP_ENDPOINT)return;
    img.dataset.fb="1";
    if(!img.dataset.fid){img.classList.add("hide");return;}
    const r=await apiGet(FELLOWSHIP_ENDPOINT,{kind:"img",id:img.dataset.fid},40000);
    if(r.ok&&r.data)img.src="data:"+(r.mime||"image/jpeg")+";base64,"+r.data;
    else img.classList.add("hide");
  },true);
}

/* leader moderation lives inside the gear. Live mode removes the Drive file too. */
async function renderFellAdmin(slot,opts){
  opts=opts||{};
  const live=!!FELLOWSHIP_ENDPOINT;
  if(live&&!leaderKey())return keyForm(slot,false);
  const paint=(posts,loading)=>{
    slot.innerHTML=(live
      ?'<div class="fbar"><span class="badge b-live">'+esc(t("ld_live_fl"))+'</span>'+
        '<button class="btn sm" id="faRefresh"'+(loading?" disabled":"")+'>'+(loading?'<span class="spin"></span>':"")+esc(loading?t("loading"):t("ld_refresh"))+"</button></div>"
      :'<div class="note warn"><span class="badge b-demo">'+esc(t("fl_demo"))+"</span></div>")+
      '<div class="fgrid" style="margin-top:14px">'+
      (posts.length?posts.map(p=>photoCard(p,{admin:true})).join(""):"")+"</div>"+
      (posts.length?"":'<p class="lead" style="margin-top:24px">'+esc(t("fl_empty"))+"</p>")+
      (live?'<p class="center" style="margin-top:22px"><button class="btn sm" id="faForget">'+esc(t("ld_key_forget"))+"</button></p>":"");
    bindImgFallback(slot);
    if(live){$("faRefresh").onclick=()=>renderLeader();$("faForget").onclick=()=>{ls.del(LS_KEY);renderLeader();};}
    slot.onclick=async e=>{
      const b=e.target.closest("[data-fdel]");if(!b)return;
      if(!confirm(t("fl_delq")))return;
      const id=b.dataset.fdel;
      if(!live){flSave(flLoad().filter(x=>x.id!==id));renderLeader();return;}
      b.disabled=true;b.innerHTML='<span class="spin"></span>'+esc(t("loading"));
      const r=await apiPost(FELLOWSHIP_ENDPOINT,{kind:"photo_delete",key:leaderKey(),id});
      if(r.ok){flCacheSave(flCache().filter(x=>x.id!==id));toast(t("fl_deleted"));renderFellAdmin(slot,{noFetch:true});}
      else if(r.error==="unauthorized"){ls.del(LS_KEY);keyForm(slot,true);}
      else{toast(t("fl_delfail"),"err");renderFellAdmin(slot,{noFetch:true});}
    };
  };
  if(!live){paint(flLoad(),false);return;}
  paint(flCache(),!opts.noFetch);
  if(opts.noFetch)return;
  const r=await flFetch();
  if(leaderTab!=="fell"||currentView!=="leader")return;
  if(r.ok)paint(r.items||[],false);
  else{paint(flCache(),false);toast(t("net_err"),"err");}
}

async function prSend(rec){
  const a=prLoad().filter(x=>x.id!==rec.id);
  if(!PRAYER_ENDPOINT){a.unshift(rec);prSave(a);return {ok:true,demo:true};}
  const r=await apiPost(PRAYER_ENDPOINT,Object.assign({kind:"prayer"},rec));
  if(r.ok){delete rec.pending;rec.synced=true;}else rec.pending=true;
  a.unshift(rec);prSave(a);
  return {ok:!!r.ok,demo:false,error:r.error};
}
/* on boot / back online: send requests that were written without signal */
async function prFlushPending(){
  if(!PRAYER_ENDPOINT||!online())return;
  const pend=prLoad().filter(x=>x.pending);
  for(const rec of pend){const r=await prSend(rec);if(!r.ok)break;}
}
/* pull status changes (New → Praying → Answered) for this phone's own requests. Status only, never content. */
async function prSyncStatus(){
  if(!PRAYER_ENDPOINT||!online())return false;
  const mine=prLoad().filter(x=>x.synced&&!x.pending);if(!mine.length)return false;
  const r=await apiGet(PRAYER_ENDPOINT,{kind:"status",ids:mine.slice(0,40).map(x=>x.id).join(",")});
  if(!r.ok||!Array.isArray(r.items))return false;
  const all=prLoad();let changed=false;
  r.items.forEach(it=>{const i=all.findIndex(x=>x.id===it.id);
    if(i>=0&&it.status&&all[i].status!==it.status){all[i].status=it.status;changed=true;}});
  if(changed)prSave(all);
  return changed;
}

/* Demo mode edits the phone's own list. Live mode edits the cache first (instant), then tells the Sheet. */
async function renderInbox(slot,opts){
  opts=opts||{};
  const live=!!PRAYER_ENDPOINT;
  if(live&&!leaderKey())return keyForm(slot,false);
  const load=()=>live?inboxCache():prLoad();
  const save=a=>live?inboxCacheSave(a):prSave(a);
  const paint=(loading)=>{
    const all=load();
    slot.innerHTML=(live
      ?'<div class="fbar"><span class="badge b-live">'+esc(t("ld_live_pr"))+'</span>'+
        '<button class="btn sm" id="ibRefresh"'+(loading?" disabled":"")+'>'+(loading?'<span class="spin"></span>':"")+esc(loading?t("loading"):t("ld_refresh"))+"</button></div>"
      :'<div class="note warn"><span class="badge b-demo">'+esc(t("pr_demo"))+"</span><br><br>"+t("pr_demo_note")+"</div>")+
      '<div style="margin-top:14px">'+(all.length?all.map(r=>prCard(r,true)).join(""):'<p class="lead" style="margin-top:24px">'+esc(t("ld_inbox_empty"))+"</p>")+"</div>"+
      (live?'<p class="center" style="margin-top:22px"><button class="btn sm" id="ibForget">'+esc(t("ld_key_forget"))+"</button></p>":"");
    if(live){$("ibRefresh").onclick=()=>renderLeader();$("ibForget").onclick=()=>{ls.del(LS_KEY);ls.del(LS_INBOX);renderLeader();};}
    slot.querySelectorAll('input[data-act="note"]').forEach(inp=>{
      inp.onchange=()=>{const id=inp.closest(".prcard").dataset.id,a=load(),i=a.findIndex(x=>x.id===id);
        if(i<0)return;a[i].note=inp.value;save(a);
        if(live)push({kind:"prayer_note",id,note:inp.value});};
    });
  };
  const push=async payload=>{
    payload.key=leaderKey();
    const r=await apiPost(PRAYER_ENDPOINT,payload);
    if(r.ok)return;
    if(r.error==="unauthorized"){ls.del(LS_KEY);if(currentView==="leader"&&leaderTab==="inbox")keyForm(slot,true);return;}
    toast(t("net_err"),"err");
  };
  slot.onclick=e=>{
    const b=e.target.closest("[data-act]");if(!b||b.tagName==="INPUT")return;
    const id=b.closest(".prcard").dataset.id,a=load(),i=a.findIndex(x=>x.id===id);
    if(i<0)return;
    const act=b.dataset.act;
    if(act==="del"){if(!confirm(t("ld_del")+"?"))return;a.splice(i,1);save(a);if(live)push({kind:"prayer_delete",id});}
    else{const next=a[i].status===act?"new":act;a[i].status=next;save(a);if(live)push({kind:"prayer_update",id,status:next});}
    paint(false);
  };
  paint(live&&!opts.noFetch);
  if(!live||opts.noFetch)return;
  if(!online()){paint(false);return;}
  const r=await inboxFetch();
  if(leaderTab!=="inbox"||currentView!=="leader")return;
  if(r.ok)paint(false);
  else if(r.error==="unauthorized"){ls.del(LS_KEY);keyForm(slot,true);}
  else{paint(false);toast(t("net_err"),"err");}
}

    if(en.target.id==="stats")countUp(en.target);}}),
    {rootMargin:"0px 0px -8% 0px",threshold:.06});

/* the stat band counts up from zero the first time it scrolls into view */
function countUp(box){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches||box.dataset.counted)return;
  box.dataset.counted="1";
  box.querySelectorAll(".stat b").forEach((b,i)=>{
    const end=parseInt(b.textContent,10);if(isNaN(end))return;
    const t0=performance.now()+i*90,dur=900;
    (function step(now){
      const k=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-k,3);
      b.textContent=Math.round(end*e);
      if(k<1)requestAnimationFrame(step);else b.textContent=end;
    })(performance.now());
  });
}
function revealScan(){
  document.querySelectorAll(".rv:not(.in)").forEach(n=>{

/* ============================================================
   15. SERVICE SCHEDULE + COUNTDOWN
   ============================================================ */
/* Leaders set these; they travel inside the share link. */
/* Sunday timeline, set by the team (30 Aug 2026): Huddle 90 minutes before the service,
   Company Call 60 before, Open Doors 15 before. For the 4:00 PM service that is 2:30, 3:00
   and 3:45; the same arithmetic gives 8:30, 9:00 and 9:45 for the 10:00 AM service. */
let sched={day:0,times:["10:00","16:00"],huddleMins:90,callMins:60,doorsMins:15,duty:1,partner:2};
const STEP_ORDER=[["huddle","tl_huddle"],["call","tl_call"],["doors","tl_doors"],["svc","tl_svc"]];
function milestones(svc){
  const m=k=>new Date(svc.getTime()-(Number(sched[k])||0)*60000);
  return {svc,huddle:m("huddleMins"),call:m("callMins"),doors:m("doorsMins")};
}
const sortedTimes=()=>sched.times.slice().sort((a,b)=>toMins(a)-toMins(b));
const toMins=tm=>{const[h,m]=String(tm).split(":").map(Number);return (h||0)*60+(m||0);};
/* the next step on the timeline that has not happened yet */
function nextStep(n){
  const now=new Date();
  for(const [k,lbl] of STEP_ORDER){if(n[k]>now)return {key:k,label:lbl,at:n[k]};}
  return {key:"svc",label:"tl_svc",at:n.svc};
}
const locale=()=>LANG==="en"?"en-PH":"fil-PH";
const fmtTime=d=>new Intl.DateTimeFormat(locale(),{hour:"numeric",minute:"2-digit"}).format(d);
/* one line per service: "10:00 AM Service: Huddle 8:30 AM · Company Call 9:00 AM · Open Doors 9:45 AM" */
function timelineLines(){
  return sortedTimes().map(tm=>{
    const n=milestones(new Date(2026,0,4,Math.floor(toMins(tm)/60),toMins(tm)%60));
    return "<b>"+esc(fmtTime(n.svc))+" "+esc(t("cd_svc"))+"</b>: "+esc(t("tl_huddle"))+" "+esc(fmtTime(n.huddle))+
      " · "+esc(t("tl_call"))+" "+esc(fmtTime(n.call))+" · "+esc(t("tl_doors"))+" "+esc(fmtTime(n.doors));
  }).join("<br>");
}
/* Communion Sunday = last Sunday of the month, in white (handbook p.7-8, p.15). */
function isLastSundayOf(d){const n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7);return n.getMonth()!==d.getMonth();}
const attireFor=d=>isLastSundayOf(d)?"white":"black";
const attireTag=d=>{const a=attireFor(d);return '<span class="attire '+a+'"><i></i>'+esc(t(a==="white"?"att_white":"att_black"))+"</span>";};
/* the handbook pairs Team 1 with Team 2 (AM) and Team 3 with Team 4 (PM) */
const partnerOf=team=>team%2===1?team+1:team-1;
/* sched.duty is the team for THIS week's Sunday; later Sundays advance one team a week,
   exactly as the rotation strip shows, so the countdown never disagrees with the strip */
function dutyFor(d){
  const anchor=nextSundays(1)[0];
  const weeks=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-anchor)/(7*864e5));
  return ((sched.duty-1+weeks)%4+4)%4+1;
}
/* the next service that has not started yet, with its huddle / call / doors times */
function nextService(){
  const now=new Date();
  for(let d=0;d<8;d++){
    const day=new Date(now.getFullYear(),now.getMonth(),now.getDate()+d);
    if(day.getDay()!==sched.day)continue;
    for(const tm of sortedTimes()){
      const svc=new Date(day.getFullYear(),day.getMonth(),day.getDate(),Math.floor(toMins(tm)/60),toMins(tm)%60,0,0);
      if(svc>now)return milestones(svc);
    }
  }
  return null;
}
let cdTimer=null;
function renderCountdown(){
  const box=$("countdown");if(!box)return;
  clearInterval(cdTimer);
  const n=nextService();
  if(!n){box.innerHTML='<div class="cdwrap"><div class="who"><p class="kick">'+esc(t("cd_kick"))+
    '</p><b>'+esc(t("cd_none"))+"</b></div></div>";return;}
  const step=nextStep(n),now=new Date();
  const dfmt=new Intl.DateTimeFormat(locale(),{weekday:"long",day:"numeric",month:"long"});
  const rows=STEP_ORDER.map(([k,l])=>'<div class="'+(k===step.key?"next":(n[k]<=now?"past":""))+'"><i></i><b>'+
    esc(fmtTime(n[k]))+"</b><span>"+esc(t(l))+"</span></div>").join("");
  box.innerHTML='<div class="cdwrap"><div class="who"><p class="kick">'+esc(t("cd_next"))+": "+esc(t(step.label))+"</p>"+
    "<b>"+esc(dfmt.format(step.at))+" · "+esc(fmtTime(step.at))+"</b>"+
    "<span>"+esc(t("cd_svc"))+" "+esc(fmtTime(n.svc))+" · "+esc(t("cd_team"))+" "+dutyFor(n.svc)+"</span>"+
    '<div class="tline">'+rows+"</div>"+
    '<div class="cdtags">'+attireTag(n.svc)+'<span class="ontime">'+esc(t("cd_ontime"))+"</span></div></div>"+
    '<div class="cdunits" id="cdu"></div>'+
    '<button class="cta" data-v="me">'+esc(t("cd_cta"))+"</button></div>";
  const units=$("cdu");
  const labels=[t("cd_d"),t("cd_h"),t("cd_m"),t("cd_s")];
  units.innerHTML=labels.map((l,i)=>'<div class="cdu"><b id="cdv'+i+'">0</b><span>'+esc(l)+"</span></div>").join("");
  function tick(){
    const ms=step.at-new Date();
    if(ms<=0){renderCountdown();return;}
    const s=Math.floor(ms/1000);
    const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
    v.forEach((x,i)=>{const e=$("cdv"+i);if(e)e.textContent=String(x).padStart(i?2:1,"0");});
  }
  tick();cdTimer=setInterval(tick,1000);
}

function nextSundays(k){
  const out=[],now=new Date();
  let d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  while(d.getDay()!==sched.day)d.setDate(d.getDate()+1);
  for(let i=0;i<k;i++){out.push(new Date(d));d.setDate(d.getDate()+7);}
  return out;
}

  box.innerHTML=days.map((d,i)=>{
    const duty=((sched.duty-1+i)%4)+1, partner=partnerOf(duty);
    return '<div class="rotc'+(i===0?" now":"")+'"><div class="d">'+esc(fmt.format(d).toUpperCase())+"</div>"+
      '<div class="tm">'+esc(t("fl_team"))+" "+duty+"</div>"+
      '<div class="p">'+esc(t("rot_partner"))+" "+partner+"</div>"+
      (isLastSundayOf(d)?'<span class="cm">'+esc(t("comm_short"))+"</span>":"")+"</div>";

}

    if(times.length)sched.times=times;
    const mins=(id,dflt)=>{const v=Number($(id).value);return Math.max(0,Math.min(240,isNaN(v)?dflt:v));};
    sched.huddleMins=mins("scHuddle",90);

/* hero doors follow the cursor on a mouse, auto-open on touch */
(function heroDoors(){
  const hero=$("hero");if(!hero)return;
  const fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(!fine||reduce){setTimeout(()=>hero.classList.add("open"),300);return;}
  const REST=0.24;
  let target=REST,cur=0,tTilt=0,cTilt=0,raf=null,idle=null;
  hero.classList.add("live");
  const write=()=>{hero.style.setProperty("--open",cur.toFixed(4));hero.style.setProperty("--tilt",cTilt.toFixed(3));};
  function loop(){
    cur+=(target-cur)*0.14;cTilt+=(tTilt-cTilt)*0.10;write();
    if(Math.abs(target-cur)>0.001||Math.abs(tTilt-cTilt)>0.002)raf=requestAnimationFrame(loop);else raf=null;
  }
  const kick=()=>{if(!raf)raf=requestAnimationFrame(loop);};
  addEventListener("pointermove",e=>{
    if(e.pointerType!=="mouse")return;
    if(currentView!=="home"){target=REST;return kick();}
    const r=hero.getBoundingClientRect();
    if(r.bottom<0||r.top>innerHeight){target=REST;tTilt=0;return kick();}
    const cx=r.left+r.width*0.7, cy=r.top+r.height*0.42;
    const dx=e.clientX-cx, dy=(e.clientY-cy)*1.25;
    const reach=Math.max(r.width*0.62,480);
    const k=1-Math.min(1,Math.hypot(dx,dy)/reach);
    target=REST+(1-REST)*Math.pow(k,1.25);
    tTilt=Math.max(-1,Math.min(1,dx/(r.width*0.4)));
    kick();
  },{passive:true});
  document.addEventListener("mouseleave",()=>{target=REST;tTilt=0;kick();});
  hero.addEventListener("click",()=>{target=1;kick();clearTimeout(idle);idle=setTimeout(()=>{target=REST;kick();},2600);});
  setTimeout(()=>{target=1;kick();setTimeout(()=>{target=REST;kick();},1600);},280);
})();
})();
